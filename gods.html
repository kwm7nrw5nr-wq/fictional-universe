<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星神圖鑑｜虛構世界</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    background:
        radial-gradient(circle at top, #18233d 0%, #090d18 45%, #05070d 100%);
    color: #f5f7ff;
    min-height: 100vh;
}

a {
    color: inherit;
    text-decoration: none;
}

/* ===== 頂部 ===== */

.header {
    padding: 50px 20px 35px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.header .symbol {
    font-size: 42px;
    margin-bottom: 8px;
}

.header h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 4px;
}

.header p {
    margin: 12px 0 0;
    color: #9da8c2;
    font-size: 15px;
}

/* ===== 導覽 ===== */

.nav {
    display: flex;
    justify-content: center;
    gap: 12px;
    padding: 18px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(5,8,16,0.65);
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(12px);
}

.nav a {
    padding: 9px 16px;
    border-radius: 20px;
    color: #b8c2da;
    transition: 0.2s;
}

.nav a:hover {
    background: rgba(255,255,255,0.08);
    color: white;
}

/* ===== 工具列 ===== */

.controls {
    max-width: 1300px;
    margin: 25px auto 10px;
    padding: 0 20px;
}

.search {
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: white;
    font-size: 16px;
    outline: none;
}

.search:focus {
    border-color: rgba(130,170,255,0.6);
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 14px;
}

.filter {
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #cbd3e7;
    padding: 8px 13px;
    border-radius: 18px;
    cursor: pointer;
}

.filter.active {
    background: rgba(130,160,255,0.2);
    border-color: rgba(150,180,255,0.5);
    color: white;
}

/* ===== 統計 ===== */

.stats {
    max-width: 1300px;
    margin: 18px auto;
    padding: 0 20px;
    color: #8f9ab5;
    font-size: 14px;
}

/* ===== 星神卡片 ===== */

.gods-grid {
    max-width: 1300px;
    margin: 0 auto;
    padding: 10px 20px 50px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

.god-card {
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.09),
            rgba(255,255,255,0.025)
        );
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px;
    overflow: hidden;
    transition:
        transform 0.25s,
        border-color 0.25s,
        box-shadow 0.25s;
    cursor: pointer;
}

.god-card:hover {
    transform: translateY(-5px);
    border-color: rgba(160,185,255,0.35);
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
}

.god-image {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: #101522;
}

.god-info {
    padding: 17px;
}

.number {
    color: #77829d;
    font-size: 12px;
    margin-bottom: 5px;
}

.path {
    color: #aeb9d5;
    font-size: 14px;
    margin-bottom: 5px;
}

.name {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 12px;
}

.tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.tag {
    padding: 5px 9px;
    border-radius: 10px;
    background: rgba(255,255,255,0.06);
    color: #b9c3da;
    font-size: 12px;
}

/* ===== 詳細視窗 ===== */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.78);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(950px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background:
        linear-gradient(145deg, #111a2d, #080c15);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 25px;
    position: relative;
}

.close {
    position: absolute;
    right: 18px;
    top: 15px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.modal-top {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 25px;
}

.modal-image {
    width: 100%;
    border-radius: 16px;
    object-fit: cover;
}

.modal-title {
    font-size: 32px;
    margin: 5px 0;
}

.modal-path {
    color: #9eabc8;
    margin-bottom: 18px;
}

.quote {
    padding: 15px 18px;
    margin: 20px 0;
    border-left: 3px solid #7d94d8;
    background: rgba(255,255,255,0.04);
    color: #c9d1e5;
    line-height: 1.8;
}

.section {
    margin-top: 25px;
}

.section h3 {
    margin-bottom: 10px;
    font-size: 18px;
}

.ability {
    margin: 10px 0;
    padding: 13px;
    border-radius: 12px;
    background: rgba(255,255,255,0.035);
}

.ability strong {
    display: block;
    margin-bottom: 5px;
}

.ability span {
    color: #aab4ca;
    font-size: 14px;
    line-height: 1.7;
}

/* ===== 無結果 ===== */

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: #77829d;
}

/* ===== 手機 ===== */

@media (max-width: 1000px) {
    .gods-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 700px) {
    .header {
        padding: 35px 15px 25px;
    }

    .header h1 {
        font-size: 27px;
    }

    .nav {
        overflow-x: auto;
        justify-content: flex-start;
        white-space: nowrap;
    }

    .gods-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 10px 12px 35px;
    }

    .god-info {
        padding: 12px;
    }

    .name {
        font-size: 18px;
    }

    .modal-top {
        grid-template-columns: 1fr;
    }

    .modal-image {
        max-height: 360px;
    }
}

@media (max-width: 430px) {
    .gods-grid {
        grid-template-columns: 1fr;
    }

    .god-image {
        aspect-ratio: 16 / 10;
    }
}
</style>
</head>

/* ===== 顯示 ===== */

const grid = document.getElementById("godsGrid");
const search = document.getElementById("search");
const count = document.getElementById("count");

let currentFaction = "全部";

function render() {

    const keyword = search.value.trim().toLowerCase();

    const filtered = gods.filter(god => {

        const factionMatch =
            currentFaction === "全部" ||
            god.faction === currentFaction;

        const text =
            god.path +
            god.name +
            god.realm +
            god.law +
            god.envoy +
            god.concept;

        const searchMatch =
            text.toLowerCase().includes(keyword);

        return factionMatch && searchMatch;
    });

    count.textContent = filtered.length;

    if (filtered.length === 0) {
        grid.innerHTML =
            `<div class="empty">沒有找到符合條件的星神。</div>`;
        return;
    }

    grid.innerHTML = filtered.map(god => `

        <article class="god-card" onclick="openModal(${god.id})">

            <img
                class="god-image"
                src="${god.image}"
                alt="${god.path}—${god.name}"
                onerror="this.style.opacity='0.2'"
            >

            <div class="god-info">

                <div class="number">
                    #${String(god.id).padStart(2, "0")}
                </div>

                <div class="path">
                    〈${god.path}〉
                </div>

                <div class="name">
                    ${god.name}
                </div>

                <div class="tags">
                    <span class="tag">${god.faction}</span>
                    <span class="tag">${god.realm}</span>
                </div>

            </div>

        </article>

    `).join("");
}


/* ===== 陣營篩選 ===== */

document.querySelectorAll(".filter").forEach(button => {

    button.addEventListener("click", () => {

        document
            .querySelectorAll(".filter")
            .forEach(b => b.classList.remove("active"));

        button.classList.add("active");

        currentFaction =
            button.dataset.faction;

        render();

    });

});


/* ===== 搜尋 ===== */

search.addEventListener("input", render);


/* ===== 詳細資料 ===== */

function openModal(id) {

    const god = gods.find(g => g.id === id);

    if (!god) return;

    document.getElementById("modalContent").innerHTML = `

        <div class="modal-top">

            <img
                class="modal-image"
                src="${god.image}"
                alt="${god.path}—${god.name}"
            >

            <div>

                <div class="number">
                    #${String(god.id).padStart(2, "0")}
                </div>

                <h2 class="modal-title">
                    〈${god.path}〉 ${god.name}
                </h2>

                <div class="modal-path">
                    ${god.faction}
                   　${god.realm}
                   　· 神律 ${god.law}
                </div>

                <div class="tag">
                    令使：${god.envoy}
                </div>

                <div class="quote">
                    「${god.quote}」
                </div>

                <p style="line-height:1.8;color:#b9c3d8;">
                    ${god.concept}
                </p>

            </div>

        </div>

        <div class="section">

            <h3>✦ 核心權能</h3>

            ${god.abilities.map((a, i) => `

                <div class="ability">

                    <strong>
                        ${i + 1}. ${a[0]}
                    </strong>

                    <span>
                        ${a[1]}
                    </span>

                </div>

            `).join("")}

        </div>

    `;

    document.getElementById("modal").classList.add("show");
}


function closeModal() {
    document.getElementById("modal").classList.remove("show");
}


document.getElementById("modal").addEventListener("click", e => {

    if (e.target.id === "modal") {
        closeModal();
    }

});


document.addEventListener("keydown", e => {

    if (e.key === "Escape") {
        closeModal();
    }

});

render();
