<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>虛構世界</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080b12;
      color: #e8ecf5;
    }

    header {
      padding: 28px 20px;
      text-align: center;
      border-bottom: 1px solid #202638;
      background: #0d111c;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 10px 0 0;
      color: #8993a8;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px;
    }

    .welcome {
      padding: 30px;
      border: 1px solid #252c3e;
      border-radius: 16px;
      background: #101522;
    }

    .welcome h2 {
      margin-top: 0;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 20px;
    }

    .card {
      padding: 22px;
      border: 1px solid #252c3e;
      border-radius: 14px;
      background: #0d121e;
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      color: #929caf;
      line-height: 1.6;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      background: #5865f2;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #status {
      margin-top: 15px;
      color: #9da8bd;
    }

    @media (max-width: 700px) {
      header h1 {
        font-size: 26px;
      }

      main {
        padding: 20px 14px;
      }

      .welcome {
        padding: 22px;
      }

      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🌌 虛構世界</h1>
    <p>一個會自行運轉的宇宙</p>
  </header>

  <main>

    <section class="welcome">
      <h2>歡迎來到這個宇宙</h2>
      <p>
        這是一個正在自行運轉的虛構世界。
        文明會誕生、發展、衰落，生命會突破境界，
        而宇宙中也存在尚未被觀測的未知。
      </p>

      <button onclick="startWorld()">開始探索</button>

      <div id="status">世界尚未啟動。</div>
    </section>

    <section class="cards">

      <div class="card">
        <h3>🌌 宇宙</h3>
        <p>探索超星系團、星系團、星系與恆星系。</p>
      </div>

      <div class="card">
        <h3>🏛️ 文明</h3>
        <p>觀察文明誕生、發展，以及高境界強者帶來的文明躍遷。</p>
      </div>

      <div class="card">
        <h3>❓ 未知</h3>
        <p>宇宙中存在無法觀測、甚至可能極度危險的未知文明。</p>
      </div>

    </section>

  </main>

  <script>
    let worldRunning = false;

    function startWorld() {
      worldRunning = true;

      document.getElementById("status").textContent =
        "世界已啟動。時間開始流動……";
    }
  </script>

</body>
</html>
